name: Bird of the Day

on:
  schedule:
    # Odd minutes on purpose. GitHub queues scheduled runs and drops the
    # ones it cannot serve, and the top of the hour is where every cron in
    # the world piles up. Measured on this repository: from 16 to 26 Aug
    # 2026 the ':00' tick landed between 02:53 and 03:04 every day, then
    # drifted to 12:24, 13:53 and 08:41 on the 27th, 28th and 29th, and on
    # the 30th had not fired at all by 06:47.
    - cron: '17 2 * * *'  # 02:17 UTC, about 04:17 CEST (Madrid)
    - cron: '23 6 * * *'  # second tick: backfill retries same-day LLM/GBIF failures
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Generate bird of the day
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
          BOTD_LLM_API_KEY: ${{ secrets.BOTD_LLM_API_KEY }}
        run: uv run python -m scripts.generate

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage whatever the run produced. An explicit list has been
          # wrong twice already (first assets/, then the per-month and
          # per-species pages), and a missing path publishes a site whose
          # links 404 while the run still reports success. .gitignore
          # keeps secrets and the virtualenv out.
          git add -A .
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "🐦 Bird of the day: $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
